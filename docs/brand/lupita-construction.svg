<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img"><title>Lupita construction</title><style>
  .ink { fill: none; stroke: #1f1f1d; stroke-width: 8; stroke-linecap: round; }
